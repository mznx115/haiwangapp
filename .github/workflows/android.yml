name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 发布 Release 需要写权限。
# 若仓库 Settings → Actions → General → Workflow permissions 是只读，
# 这里申请的写权限会被忽略，发布步骤会 403。
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit test（skill 输出解析器）
        run: pnpm test

      - name: Build web assets
        run: pnpm build

      # 老版 Android WebView 不认识 @layer，会整份丢弃样式（表现为「CSS 没加载」）。
      # 这一步守住底线：产物里不允许再出现 @layer。
      - name: Verify CSS compatibility
        run: pnpm verify:css

      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ---------- Android 工具链 ----------

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ---------- 签名密钥 ----------
      # 刻意不在 if 里用 secrets 上下文（部分场景不可用），改用 shell 判断，
      # 这样没配密钥时只是回退成 debug 签名，而不是让整个工作流挂掉。

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::未配置 KEYSTORE_BASE64，本次产出 debug 签名包"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > haiwang-release.p12
          {
            printf 'storeFile=haiwang-release.p12\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeType=PKCS12\n'
          } > keystore.properties
          echo "签名密钥已就绪：$(stat -c%s haiwang-release.p12) 字节"

      # ---------- 构建 ----------

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          if [ -f keystore.properties ]; then
            TASK=assembleRelease
            echo "APK_DIR=android/app/build/outputs/apk/release" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            TASK=assembleDebug
            echo "::warning::未配置签名密钥，回退为 debug 签名"
            echo "APK_DIR=android/app/build/outputs/apk/debug" >> "$GITHUB_ENV"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

          echo "执行 ./gradlew ${TASK}（versionCode=${VERSION_CODE}）"
          if ./gradlew "$TASK" --no-daemon --stacktrace > /tmp/gradle.log 2>&1; then
            tail -n 12 /tmp/gradle.log
          else
            # 把关键报错行提升为 GitHub 注解。
            # 注解可以通过公开的 check-run annotations 接口读到，
            # 这样即使本地没有仓库写权限，也能定位 CI 失败原因。
            grep -nE "FAILURE|What went wrong|^> |Caused by|Could not|error:|BUILD FAILED" /tmp/gradle.log \
              | head -n 8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            echo "===== gradle.log 末尾 40 行 ====="
            tail -n 40 /tmp/gradle.log
            exit 1
          fi

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(find "${APK_DIR}" -name '*.apk' | head -n 1)
          echo "产物：$APK（$SIGNED 签名）"
          if [ "$SIGNED" != "release" ]; then
            echo "::notice::debug 签名，跳过校验。配置签名密钥后将自动改为 release 签名。"
            exit 0
          fi
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # ---------- 上传 ----------

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: haiwang-${{ github.sha }}
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release（main 分支）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          APK=$(find "${APK_DIR}" -name '*.apk' | head -n 1)
          cp "$APK" haiwang.apk
          SIZE=$(du -h haiwang.apk | cut -f1)
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-latest/haiwang.apk"

          if [ "$SIGNED" = "release" ]; then
            SIGN_LINE="release 正式签名（可覆盖安装升级）"
            SIGN_NOTE=""
          else
            SIGN_LINE="⚠️ debug 签名"
            SIGN_NOTE=$'\n> **当前未配置签名密钥**，这是 debug 签名包。\n> 从 debug 包切换到正式签名包时，因为签名不一致，需要先卸载旧版再安装。\n'
          fi

          # 用 printf 而不是 heredoc：YAML 块标量会给每行加缩进，
          # 而 Markdown 里 4 个前导空格就是代码块，会把整个说明渲染坏。
          {
            printf 'main 分支自动构建，每次推送覆盖更新。\n\n'
            printf '| 项目 | 值 |\n'
            printf '| --- | --- |\n'
            printf '| 提交 | `%s` |\n' "$SHORT_SHA"
            printf '| 构建时间 | %s |\n' "$NOW"
            printf '| 安装包大小 | %s |\n' "$SIZE"
            printf '| 签名 | %s |\n\n' "$SIGN_LINE"
            printf '%s\n' "$SIGN_NOTE"
            printf '### 下载\n\n'
            printf '点下方 Assets 里的 `haiwang.apk`，**无需登录**。\n\n'
            printf '永久直链（可收藏或分享给朋友）：\n\n'
            printf '    %s\n\n' "$URL"
            printf '### 安装\n\n'
            printf '1. 手机浏览器打开本页，下载 `haiwang.apk`\n'
            printf '2. 点击安装。首次会被系统拦一下，需要在「设置 → 应用 → 特殊权限 → 安装未知应用」里允许你的浏览器\n'
          } > release-notes.md

          if ! gh release view build-latest >/dev/null 2>&1; then
            gh release create build-latest --title "海王 Android 版" --notes "初始化"
          fi

          # --clobber：覆盖同名资源，保证永远只有最新那一个 apk
          gh release upload build-latest haiwang.apk --clobber

          gh release edit build-latest \
            --latest \
            --title "海王 Android 版 · 最新构建（${SHORT_SHA}）" \
            --notes-file release-notes.md

          echo "已发布：https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-latest"

      - name: Publish versioned release（v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          APK=$(find "${APK_DIR}" -name '*.apk' | head -n 1)
          cp "$APK" "haiwang-${TAG}.apk"
          SIZE=$(du -h "haiwang-${TAG}.apk" | cut -f1)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "haiwang-${TAG}.apk" --clobber
          else
            gh release create "$TAG" \
              --title "海王 ${TAG}" \
              --notes "标签 \`${TAG}\` 的构建，安装包 ${SIZE}，签名方式 ${SIGNED}。" \
              "haiwang-${TAG}.apk"
          fi

          echo "已发布：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
